<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Low-gravity Glacier Course With</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #09090b; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    #canvas-container { width: 100%; height: 100%; position: absolute; left: 0; top: 0; }
    
    /* Minimalist HUD */
    #hud {
      position: absolute; top: 16px; left: 16px; z-index: 10;
      color: #f8fafc; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 13px; background: rgba(9, 9, 11, 0.75); border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 10px 14px; border-radius: 8px; backdrop-filter: blur(8px);
      display: flex; gap: 16px; pointer-events: none;
    }
    .hud-stat { display: flex; flex-direction: column; }
    .hud-label { font-size: 10px; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.05em; }
    .hud-val { font-size: 16px; font-weight: 700; color: #38bdf8; }

    /* On-Screen Mobile Joystick */
    #mobile-controls {
      position: absolute; bottom: 24px; left: 24px; z-index: 20;
      width: 120px; height: 120px; border-radius: 50%;
      background: rgba(255, 255, 255, 0.06); border: 1px solid rgba(255, 255, 255, 0.15);
      display: none; touch-action: none;
    }
    #joystick-stick {
      position: absolute; left: 35px; top: 35px; width: 50px; height: 50px;
      border-radius: 50%; background: rgba(56, 189, 248, 0.4); border: 1px solid #38bdf8;
      pointer-events: none;
    }
    #btn-mobile-jump {
      position: absolute; bottom: 36px; right: 28px; z-index: 20;
      width: 64px; height: 64px; border-radius: 50%;
      background: rgba(56, 189, 248, 0.2); border: 1px solid #38bdf8; color: #ffffff;
      font-weight: 700; font-size: 12px; display: none; align-items: center; justify-content: center;
      user-select: none; touch-action: none;
    }
    @media (pointer: coarse) {
      #mobile-controls { display: block; }
      #btn-mobile-jump { display: flex; }
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
  <div id="canvas-container"></div>
  <div id="hud">
    <div class="hud-stat"><span class="hud-label">Energy</span><span class="hud-val" id="val-score">0</span></div>
    <div class="hud-stat"><span class="hud-label">Velocity</span><span class="hud-val" id="val-speed">0.0</span></div>
    <div class="hud-stat"><span class="hud-label">Engine</span><span class="hud-val" style="color: #4ade80;">60 FPS</span></div>
  </div>

  <div id="mobile-controls"><div id="joystick-stick"></div></div>
  <div id="btn-mobile-jump">JUMP</div>

  <script>
    (function() {
      
    // Meta AudioCraft WebAudio Procedural Synthesizer
    const AudioEngine = (function() {
      let audioCtx = null;
      let muted = false;

      function getContext() {
        if (!audioCtx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) audioCtx = new AudioContext();
        }
        if (audioCtx && audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
        return audioCtx;
      }

      return {
        playJump: function() {
          if (muted) return;
          const ctx = getContext();
          if (!ctx) return;
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(150, ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(440, ctx.currentTime + 0.15);
          gain.gain.setValueAtTime(0.2, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.15);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start();
          osc.stop(ctx.currentTime + 0.15);
        },

        playCollect: function() {
          if (muted) return;
          const ctx = getContext();
          if (!ctx) return;
          const now = ctx.currentTime;
          const notes = [523.25, 659.25, 783.99, 1046.50]; // C Major arpeggio
          notes.forEach((freq, idx) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(freq, now + idx * 0.04);
            gain.gain.setValueAtTime(0.15, now + idx * 0.04);
            gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.04 + 0.25);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(now + idx * 0.04);
            osc.stop(now + idx * 0.04 + 0.25);
          });
        },

        toggleMute: function() {
          muted = !muted;
          return muted;
        }
      };
    })();
  

      const container = document.getElementById('canvas-container');
      const valScore = document.getElementById('val-score');
      const valSpeed = document.getElementById('val-speed');

      // Scene, Camera, Renderer
      const scene = new THREE.Scene();
      scene.background = new THREE.Color('#09090b');
      scene.fog = new THREE.FogExp2('#09090b', 0.015);

      const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.shadowMap.enabled = true;
      container.appendChild(renderer.domElement);

      // Lights
      const ambientLight = new THREE.AmbientLight(0xffffff, 0.65);
      scene.add(ambientLight);

      const sunLight = new THREE.DirectionalLight('#38bdf8', 1.2);
      sunLight.position.set(20, 40, 20);
      sunLight.castShadow = true;
      scene.add(sunLight);

      // Procedural World Terrain Grid
      const terrainGeo = new THREE.PlaneGeometry(160, 160, 32, 32);
      terrainGeo.rotateX(-Math.PI / 2);
      const terrainMat = new THREE.MeshStandardMaterial({
        color: 0x0f172a,
        roughness: 0.8,
        metalness: 0.2,
        wireframe: false
      });
      const terrain = new THREE.Mesh(terrainGeo, terrainMat);
      terrain.receiveShadow = true;
      scene.add(terrain);

      // Grid helper for aesthetic tech styling
      const grid = new THREE.GridHelper(160, 40, 0x38bdf8, 0x1e293b);
      grid.position.y = 0.02;
      scene.add(grid);

      // Player Entity
      const playerGroup = new THREE.Group();
      const bodyGeo = new THREE.BoxGeometry(1.2, 1.8, 1.0);
      const bodyMat = new THREE.MeshStandardMaterial({ color: 0x38bdf8, roughness: 0.3, metalness: 0.8 });
      const bodyMesh = new THREE.Mesh(bodyGeo, bodyMat);
      bodyMesh.position.y = 0.9;
      bodyMesh.castShadow = true;
      playerGroup.add(bodyMesh);

      // Visor / Core
      const coreGeo = new THREE.BoxGeometry(0.8, 0.4, 0.3);
      const coreMat = new THREE.MeshBasicMaterial({ color: 0x00ffff });
      const coreMesh = new THREE.Mesh(coreGeo, coreMat);
      coreMesh.position.set(0, 1.2, 0.45);
      playerGroup.add(coreMesh);

      scene.add(playerGroup);

      // Collectibles
      const collectibles = [];
      const colGeo = new THREE.OctahedronGeometry(0.6);
      const colMat = new THREE.MeshStandardMaterial({ color: 0x38bdf8, roughness: 0.1, metalness: 0.9 });
      for (let i = 0; i < 20; i++) {
        const mesh = new THREE.Mesh(colGeo, colMat);
        mesh.position.set(
          (Math.random() - 0.5) * 100,
          1.2,
          (Math.random() - 0.5) * 100
        );
        mesh.castShadow = true;
        scene.add(mesh);
        collectibles.push(mesh);
      }

      // Input Handling
      const keys = {};
      window.addEventListener('keydown', e => keys[e.code] = true);
      window.addEventListener('keyup', e => keys[e.code] = false);

      // Mobile Touch Joystick
      const joystick = { x: 0, y: 0, active: false };
      const joyEl = document.getElementById('mobile-controls');
      const stickEl = document.getElementById('joystick-stick');
      let joyTouchId = null;

      joyEl.addEventListener('touchstart', e => {
        const t = e.changedTouches[0];
        joyTouchId = t.identifier;
        joystick.active = true;
      });

      window.addEventListener('touchmove', e => {
        if (!joystick.active) return;
        for (let i = 0; i < e.changedTouches.length; i++) {
          const t = e.changedTouches[i];
          if (t.identifier === joyTouchId) {
            const rect = joyEl.getBoundingClientRect();
            const cx = rect.left + rect.width / 2;
            const cy = rect.top + rect.height / 2;
            let dx = (t.clientX - cx) / (rect.width / 2);
            let dy = (t.clientY - cy) / (rect.height / 2);
            const dist = Math.sqrt(dx * dx + dy * dy);
            if (dist > 1) { dx /= dist; dy /= dist; }
            joystick.x = dx;
            joystick.y = dy;
            stickEl.style.transform = 'translate(' + (dx * 25) + 'px, ' + (dy * 25) + 'px)';
          }
        }
      });

      const endJoy = () => {
        joystick.active = false;
        joystick.x = 0;
        joystick.y = 0;
        stickEl.style.transform = 'translate(0px, 0px)';
      };
      window.addEventListener('touchend', endJoy);
      window.addEventListener('touchcancel', endJoy);

      let mobileJump = false;
      const jumpBtn = document.getElementById('btn-mobile-jump');
      jumpBtn.addEventListener('touchstart', e => { e.preventDefault(); mobileJump = true; });
      jumpBtn.addEventListener('touchend', () => mobileJump = false);

      // Game State
      let score = 0;
      let velocity = new THREE.Vector3();
      let isGrounded = true;

      // Clock
      const clock = new THREE.Clock();

      function animate() {
        requestAnimationFrame(animate);
        const dt = Math.min(clock.getDelta(), 0.1);

        // Move calculation
        let moveX = 0;
        let moveZ = 0;
        if (keys['KeyW'] || keys['ArrowUp']) moveZ -= 1;
        if (keys['KeyS'] || keys['ArrowDown']) moveZ += 1;
        if (keys['KeyA'] || keys['ArrowLeft']) moveX -= 1;
        if (keys['KeyD'] || keys['ArrowRight']) moveX += 1;

        if (joystick.active) {
          moveX = joystick.x;
          moveZ = joystick.y;
        }

        const speed = 16.0;
        velocity.x = moveX * speed;
        velocity.z = moveZ * speed;

        // Jump
        if ((keys['Space'] || mobileJump) && isGrounded) {
          velocity.y = 10.0;
          isGrounded = false;
          AudioEngine.playJump();
        }

        // Gravity
        if (!isGrounded) {
          velocity.y -= 25.0 * dt;
          if (playerGroup.position.y <= 0) {
            playerGroup.position.y = 0;
            velocity.y = 0;
            isGrounded = true;
          }
        }

        playerGroup.position.x += velocity.x * dt;
        playerGroup.position.y += velocity.y * dt;
        playerGroup.position.z += velocity.z * dt;

        // Rotate player towards movement
        if (moveX !== 0 || moveZ !== 0) {
          const angle = Math.atan2(moveX, moveZ);
          playerGroup.rotation.y = angle;
        }

        // Camera Follow
        const targetCamPos = playerGroup.position.clone().add(new THREE.Vector3(0, 7, 12));
        camera.position.lerp(targetCamPos, 0.08);
        camera.lookAt(playerGroup.position.clone().add(new THREE.Vector3(0, 1.2, 0)));

        // Animate & check collectibles
        for (let i = 0; i < collectibles.length; i++) {
          const col = collectibles[i];
          col.rotation.y += 1.5 * dt;
          col.rotation.x += 0.8 * dt;

          const dist = playerGroup.position.distanceTo(col.position);
          if (dist < 1.6) {
            score += 100;
            valScore.textContent = score;
            AudioEngine.playCollect();
            col.position.set(
              (Math.random() - 0.5) * 100,
              1.2,
              (Math.random() - 0.5) * 100
            );
          }
        }

        const currentSpeed = Math.sqrt(velocity.x * velocity.x + velocity.z * velocity.z);
        valSpeed.textContent = currentSpeed.toFixed(1);

        renderer.render(scene, camera);
      }

      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });

      animate();
    })();
  </script>
</body>
</html>
