<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mother Agatha — 3D GLB Inspector (SAM 3.1 + Blender)</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        background: #090b0e;
        color: #f4f4f6;
        font-family: system-ui, sans-serif;
        overflow: hidden;
      }
      #viewer {
        width: 100%;
        height: 100%;
        display: block;
        touch-action: none;
      }
      .hud {
        position: fixed;
        top: 14px;
        left: 14px;
        right: 14px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        pointer-events: none;
        z-index: 10;
      }
      .card {
        pointer-events: auto;
        background: rgba(14, 16, 22, 0.88);
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 10px;
        padding: 10px 14px;
        backdrop-filter: blur(8px);
      }
      .title {
        font-size: 14px;
        font-weight: 700;
        letter-spacing: 0.04em;
        color: #f8fafc;
      }
      .sub {
        font-size: 11px;
        color: #94a3b8;
        margin-top: 2px;
      }
      .actions {
        display: flex;
        gap: 8px;
        pointer-events: auto;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 8px 13px;
        border-radius: 8px;
        background: #18181b;
        color: #f4f4f6;
        border: 1px solid rgba(255, 255, 255, 0.16);
        font-size: 12px;
        font-weight: 600;
        text-decoration: none;
        cursor: pointer;
      }
      .btn:hover {
        background: #27272a;
      }
      .btn-primary {
        background: #f59e0b;
        color: #090b0e;
        border-color: #fbbf24;
      }
      .btn-primary:hover {
        background: #fbbf24;
      }
    </style>
  </head>
  <body>
    <div class="hud">
      <div class="card">
        <div class="title">MOTHER AGATHA — 3D GLB MODEL (4.2 MB)</div>
        <div class="sub" id="status">
          Drag to rotate 360° · Scroll/Pinch to zoom · SAM 3.1 Quadrant
          Calibrated
        </div>
      </div>
      <div class="actions">
        <button type="button" class="btn" id="btn-spin">Auto-Spin: ON</button>
        <a
          class="btn btn-primary"
          href="./assets/agatha.glb"
          download="agatha.glb"
          >⬇ Download agatha.glb</a
        >
      </div>
    </div>
    <canvas id="viewer"></canvas>
    <script src="/studio/vendor/three.min.js" defer></script>
    <script src="/studio/vendor/GLTFLoader.js" defer></script>
    <script src="./agatha-viewer.js" defer></script>
  </body>
</html>
